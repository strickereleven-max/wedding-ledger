    return Promise.resolve("x" + (h >>> 0).toString(16));
  }

  function persistPassHash(hash){
    if(hash) lsSet(LS_HASH, hash); else lsDel(LS_HASH);
    try{ localStorage.setItem("wedledger.passHash", hash || ""); }catch(e){}
    if(mode === "db" && db){
      db.doc("app/settings").set({ passHash: hash || "" }).catch(function(){});
    }else if(window.claude && window.claude.use){
      window.claude.use("db").then(function(d){
        if(d) d.doc("app/settings").set({ passHash: hash || "" }).catch(function(){});
      }).catch(function(){});
    }
  }

  function gate(){
    if(!window.claude && firebaseConfigured() && !window.__localOnly){
      firebaseGate();
      return;
    }
    var lockEl = document.getElementById("lock");
    var lockForm = document.getElementById("lockForm");
    var lockPass = document.getElementById("lockPass");
    var lockPass2 = document.getElementById("lockPass2");
    var lockTrust = document.getElementById("lockTrust");
    var lockSub = document.getElementById("lockSub");
    var lockErr = document.getElementById("lockErr");
    var lockGo = document.getElementById("lockGo");
    var lockReset = document.getElementById("lockReset");
    var lockBtn = document.getElementById("lockBtn");
    var card = lockEl.querySelector(".lock-card");

    function err(msg){
      lockErr.textContent = msg; lockErr.classList.remove("is-hidden");
      card.classList.remove("lock-shake"); void card.offsetWidth; card.classList.add("lock-shake");
    }
    function createMode(){
      creating = true;
      lockSub.textContent = "Create a passcode — you'll enter it each time you open this page.";
      lockPass.placeholder = "New passcode";
      lockPass.setAttribute("autocomplete", "new-password");
      lockPass2.classList.remove("is-hidden");
      lockGo.textContent = "Set passcode & continue";
      lockReset.classList.add("is-hidden");
    }
    function enterMode(){
      creating = false;
      lockSub.textContent = "Enter your passcode to continue.";
      lockPass.placeholder = "Passcode";
      lockPass.setAttribute("autocomplete", "current-password");
      lockPass2.classList.add("is-hidden");
      lockGo.textContent = "Unlock";
      lockReset.classList.remove("is-hidden");
    }
    function open(){
      lockErr.classList.add("is-hidden");
      lockPass.value = ""; lockPass2.value = "";
      lockEl.classList.remove("is-hidden");
      try{ lockPass.focus(); }catch(e){}
    }
    function unlock(){
      if(lockTrust.checked && knownHash) lsSet(LS_TRUST, knownHash); else lsDel(LS_TRUST);
      lockEl.classList.add("is-hidden");
      lockPass.value = ""; lockPass2.value = "";
      if(!appStarted){ appStarted = true; startApp(); }
    }

    lockForm.addEventListener("submit", function(ev){
      ev.preventDefault();
      var p = lockPass.value || "";
      if(creating){
        if(p.length < 4){ err("Use at least 4 characters."); return; }
        if(p !== (lockPass2.value || "")){ err("The two entries don't match."); return; }
        sha256(p).then(function(h){ knownHash = h; persistPassHash(h); unlock(); });
      }else{
        sha256(p).then(function(h){
          if(h === knownHash) unlock();
          else err("Incorrect passcode.");
        });
      }
    });

    lockReset.addEventListener("click", function(){
      if(lockReset.getAttribute("data-armed") === "1"){
        knownHash = null; persistPassHash("");
        lockReset.removeAttribute("data-armed"); lockReset.classList.remove("armed");
        lockReset.textContent = "Reset passcode";
        createMode();
        try{ lockPass.focus(); }catch(e){}
      }else{
        lockReset.setAttribute("data-armed", "1");
        lockReset.classList.add("armed");
        lockReset.textContent = "This keeps your data — click again to reset";
        setTimeout(function(){
          lockReset.removeAttribute("data-armed"); lockReset.classList.remove("armed");
          lockReset.textContent = "Reset passcode";
        }, 4000);
      }
    });

    if(lockBtn){
      lockBtn.addEventListener("click", function(){ lsDel(LS_TRUST); enterMode(); open(); });
    }

    var localHash = lsGet(LS_HASH) || "";
    if(localHash){
      knownHash = localHash;
      if(lsGet(LS_TRUST) === localHash) unlock();
      else { enterMode(); open(); }
      if(window.claude && window.claude.use){
        window.claude.use("db").then(function(d){
          if(!d) return;
          d.doc("app/settings").get().then(function(snap){
            var ph = snap.exists && snap.data() ? (snap.data().passHash || "") : "";
            if(ph && ph !== knownHash){ knownHash = ph; lsSet(LS_HASH, ph); }
          }, function(){});
        }, function(){});
      }
    }else if(window.claude && window.claude.use){
      lockSub.textContent = "Checking…";
      var done = false;
      var to = setTimeout(function(){ if(!done){ done = true; createMode(); open(); } }, 2500);
      window.claude.use("db").then(function(d){
        if(done) return;
        if(!d){ done = true; clearTimeout(to); createMode(); open(); return; }
        d.doc("app/settings").get().then(function(snap){
          if(done) return; done = true; clearTimeout(to);
          var ph = snap.exists && snap.data() ? (snap.data().passHash || "") : "";
          if(ph){ knownHash = ph; lsSet(LS_HASH, ph); enterMode(); }
          else createMode();
          open();
        }, function(){ if(!done){ done = true; clearTimeout(to); createMode(); open(); } });
      }, function(){ if(!done){ done = true; clearTimeout(to); createMode(); open(); } });
    }else{
      createMode(); open();
    }
  }

  /* ---------- boot ---------- */
  loadLocal();

  function startApp(){
    render();
    if(window.claude && typeof window.claude.use === "function"){
      window.claude.use("db").then(function(d){
        if(!d) return;
        db = d; mode = "db";
        d.doc("app/v2").get().then(function(snap){
          if(snap.exists && snap.data() && Array.isArray(snap.data().events)){
            applyRemote(snap.data());
          }else{
            Promise.all([
              d.collection("expenses").get().catch(function(){ return { docs: [] }; }),
              d.doc("app/settings").get().catch(function(){ return { exists: false }; })
            ]).then(function(r){
              var exps = (r[0].docs || []).map(function(dc){
                var o = Object.assign({}, dc.data() || {}); o.id = dc.id; return o;
              });
              var settings = r[1] && r[1].exists ? (r[1].data() || {}) : {};
              if(exps.length){
                state.data = migrateBlob({ expenses: exps, settings: settings });
                ensureEvent(); saveLocal(); render();
              }
              d.doc("app/v2").set({ events: state.data.events, currentId: state.data.currentId }).catch(function(){});
            }, function(){});
          }
          d.doc("app/v2").onSnapshot(function(s){ if(s.exists) applyRemote(s.data()); }, function(){});
        }, function(){});
        d.doc("app/settings").onSnapshot(function(snap){
          if(snap.exists){
            var ph = (snap.data() || {}).passHash || "";
            if(ph && ph !== knownHash){ knownHash = ph; lsSet(LS_HASH, ph); }
          }
        }, function(){});
      }).catch(function(){});
    }
  }

  gate();
})();
</script>
</body>
