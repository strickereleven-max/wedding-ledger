<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F6F3F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161020" media="(prefers-color-scheme: dark)">
<meta name="description" content="A private tracker for wedding costs, payments, and the balance still due to each vendor.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wedding Ledger">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>html{background:#F6F3F7;-webkit-text-size-adjust:100%}@media (prefers-color-scheme:dark){html:not([data-theme="light"]){background:#161020}}html[data-theme="dark"]{background:#161020}</style>

<title>Wedding Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  *,*::before,*::after{box-sizing:border-box}

  :root{
    --ground:#F6F3F7; --surface:#FFFFFF; --surface-2:#FBF8FC;
    --ink:#221A2A; --muted:#6B6175; --line:#E9E3EE;
    --accent:#1F7A5A; --accent-ink:#0F5038; --accent-soft:#E3F0EA;
    --due:#B5512F; --due-soft:#F7E7DF; --gold:#A9843F;
    --on-accent:#FFFFFF; --focus:#1F7A5A;
    --shadow:0 1px 2px rgba(34,26,42,.05), 0 12px 30px -16px rgba(34,26,42,.18);
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ground:#161020; --surface:#211A2C; --surface-2:#1B1425;
      --ink:#F1EAF4; --muted:#A79DB2; --line:#352B41;
      --accent:#57C79B; --accent-ink:#AEE9D2; --accent-soft:#183A2E;
      --due:#E88A62; --due-soft:#3A2416; --gold:#CFAA6A;
      --on-accent:#0E2A20; --focus:#57C79B;
      --shadow:0 1px 2px rgba(0,0,0,.35), 0 16px 36px -18px rgba(0,0,0,.7);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --ground:#161020; --surface:#211A2C; --surface-2:#1B1425;
    --ink:#F1EAF4; --muted:#A79DB2; --line:#352B41;
    --accent:#57C79B; --accent-ink:#AEE9D2; --accent-soft:#183A2E;
    --due:#E88A62; --due-soft:#3A2416; --gold:#CFAA6A;
    --on-accent:#0E2A20; --focus:#57C79B;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 16px 36px -18px rgba(0,0,0,.7);
    color-scheme:dark;
  }

  body{margin:0;background:var(--ground);color:var(--ink);
    font:400 15px/1.55 "Instrument Sans",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased}

  input,select,button{font:inherit;color:inherit}
  input[type=number]{-moz-appearance:textfield;appearance:textfield}
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px}

  /* ---- top bar ---- */
  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
    gap:14px;padding:12px clamp(16px,4vw,40px);
    background:var(--ground);
    background:color-mix(in srgb,var(--ground) 86%,transparent);
    backdrop-filter:saturate(1.4) blur(10px);
    border-bottom:1px solid var(--line)}
  .brand{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:1.1rem;letter-spacing:-.01em;
    display:flex;align-items:center;gap:9px}
  .brand .mark{color:var(--gold);font-size:1.15rem;transform:translateY(-1px)}
  .tools{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:flex-end}
  .cur{display:flex;align-items:center;gap:7px;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .cur select{font-size:.84rem;letter-spacing:0;text-transform:none;color:var(--ink);
    background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:190px}
  .cur.evt select{font-weight:600}

  main{max-width:1080px;margin:0 auto;padding:clamp(20px,4vw,38px);
    display:flex;flex-direction:column;gap:30px}

  .sec-h{font-family:"Fraunces",Georgia,serif;font-weight:500;font-size:1.18rem;letter-spacing:-.01em;
    margin:0 0 14px;text-wrap:balance}

  /* ---- summary ---- */
  .wed-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .wed{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
  .wed .k{font-size:.68rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .wed input[type=date]{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 10px}
  .wed .dtg{font-family:"Fraunces",Georgia,serif;font-style:italic;font-weight:500;color:var(--gold);font-size:1.02rem}

  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .tile{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:16px 16px 18px;
    box-shadow:var(--shadow);display:flex;flex-direction:column;gap:7px;min-width:0}
  .tile .k{font-size:.66rem;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
  .tile .v{font-family:"Fraunces",Georgia,serif;font-optical-sizing:auto;font-weight:500;
    font-size:clamp(1.6rem,4.4vw,2.35rem);line-height:1.03;letter-spacing:-.015em;
    font-variant-numeric:tabular-nums}
  .tile .s{font-size:.8rem;color:var(--muted)}
  .tile .s .ok{color:var(--accent-ink)} .tile .s .over{color:var(--due);font-weight:600}
  .tile.paid .v{color:var(--accent-ink)}
  .tile.due{border-color:color-mix(in srgb,var(--due) 40%,var(--line));
    background:linear-gradient(176deg,var(--due-soft),var(--surface) 62%)}
  .tile.due .v{color:var(--due)}
  input.v{border:1px solid transparent;background:transparent;width:100%;padding:2px 5px;margin:-2px -5px;border-radius:8px}
  input.v::placeholder{color:var(--muted);opacity:.6}
  input.v:hover{border-color:var(--line)}
  input.v:focus{outline:none;border-color:var(--focus);background:var(--ground)}

  .meter-wrap{margin-top:18px;display:flex;flex-direction:column;gap:8px}
  .meter-label{display:flex;justify-content:space-between;font-size:.72rem;font-weight:600;
    letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .meter{height:10px;border-radius:999px;background:var(--accent-soft);overflow:hidden}
  .meter-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--gold));
    transition:width .55s cubic-bezier(.4,0,.2,1)}
  .meter-sub{font-size:.82rem;color:var(--muted);font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-variant-numeric:tabular-nums}

  /* ---- add form ---- */
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;
    padding:clamp(16px,3vw,24px);box-shadow:var(--shadow)}
  .add-form{display:grid;grid-template-columns:2fr 1.4fr .9fr .9fr 1.1fr 1.1fr auto;gap:11px;align-items:end}
  .field{display:flex;flex-direction:column;gap:6px;min-width:0}
  .field label{font-size:.66rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
  .field input,.field select{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 11px}
  .field input:focus,.field select:focus{outline:none;border-color:var(--focus);
    box-shadow:0 0 0 3px var(--accent-soft);background:var(--surface)}
  .btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:11px;padding:11px 20px;
    font-weight:600;cursor:pointer;height:42px}
  .btn:hover{filter:brightness(1.06)}

  /* ---- controls ---- */
  .controls{display:flex;flex-direction:column;gap:9px;margin-bottom:16px}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);
    padding:6px 13px;border-radius:999px;font-size:.82rem;font-weight:500;cursor:pointer}
  .chip:hover{color:var(--ink);border-color:var(--muted)}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

  /* ---- ledger ---- */
  .sample-note{font-size:.82rem;color:var(--muted);background:var(--accent-soft);
    border:1px solid color-mix(in srgb,var(--accent) 25%,var(--line));border-radius:11px;
    padding:10px 13px;margin:0 0 14px}
  .empty{color:var(--muted);text-align:center;padding:30px}

  .group{background:var(--surface);border:1px solid var(--line);border-radius:15px;
    box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
  .group-h{display:flex;align-items:center;gap:12px;padding:12px 15px;
    background:var(--surface-2);border-bottom:1px solid var(--line)}
  .group-h h3{margin:0;flex:1;font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:1.12rem}
  .group-h .gc{font-size:.8rem;color:var(--muted);white-space:nowrap}
  .group-h .gd{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.92rem;font-weight:600;
    color:var(--due);font-variant-numeric:tabular-nums;white-space:nowrap}
  .group-h .gd.zero{color:var(--accent-ink)}

  .row{display:grid;grid-template-columns:minmax(140px,1.9fr) 1fr 1fr .8fr 1fr 74px;
    gap:14px;align-items:center;padding:10px 18px;border-top:1px solid var(--line)}
  .row:not(.head):hover{background:var(--surface-2)}
  .row.head{border-top:0;padding:13px 18px 8px}
  .row.head span{font-size:.68rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
    color:var(--ink);opacity:.55;text-align:right}
  .row.head span:first-child,
  .row.head span:nth-child(5){text-align:left}
  .cell{min-width:0}
  .cell::before{display:none}
  .cell.vend{display:flex;flex-direction:column;gap:2px}
  .cell.figure{display:flex;flex-direction:column;align-items:flex-end;gap:1px;text-align:right}
  .cell.act{display:flex;gap:6px;justify-content:flex-end}
  .vend-in{font-weight:600;font-size:.96rem;color:var(--ink);width:100%;border:1px solid transparent;
    background:transparent;border-radius:8px;padding:7px 8px;margin-left:-8px}
  .vend-in:hover{border-color:var(--line)}
  .vend-in:focus{outline:none;border-color:var(--focus);background:var(--ground)}
  .vend-ro{font-weight:600;font-size:.96rem;padding:7px 0;display:inline-block}
  .num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.98rem;font-weight:500;color:var(--ink);
    text-align:right;width:100%;border:1px solid transparent;background:transparent;border-radius:8px;
    padding:7px 8px;margin-right:-8px;font-variant-numeric:tabular-nums}
  .num:hover{border-color:var(--line)}
  .num:focus{outline:none;border-color:var(--focus);background:var(--ground);margin-right:0}
  .ro{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.98rem;color:var(--ink);
    display:block;text-align:right;font-variant-numeric:tabular-nums;padding:1px 0}
  .cell.figure .ro{color:var(--accent-ink)}
  .cell.figure .ro.zero{color:var(--muted)}
  .pcount-btn{display:inline-flex;align-items:center;gap:5px;background:none;border:0;cursor:pointer;
    font-size:.66rem;color:var(--muted);padding:1px 0;text-align:right}
  .pcount-btn:hover{color:var(--ink)}
  .pcount-btn .chev{font-size:.6rem;line-height:1;transition:transform .15s;opacity:.8}
  .pcount-btn[aria-expanded="true"] .chev{transform:rotate(90deg)}
  .row-detail{background:var(--surface-2);border-top:1px solid var(--line);
    padding:9px 16px 12px;display:flex;flex-direction:column;gap:3px}
  .pd-row{display:grid;grid-template-columns:auto auto 1fr auto;gap:12px;align-items:center;
    font-size:.86rem;padding:4px 0}
  .pd-date{font-family:"IBM Plex Mono",ui-monospace,monospace;color:var(--muted);white-space:nowrap}
  .pd-note{font-size:.78rem;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pd-amt{font-family:"IBM Plex Mono",ui-monospace,monospace;font-weight:600;
    font-variant-numeric:tabular-nums;text-align:right}
  .pd-empty{font-size:.82rem;color:var(--muted);padding:2px 0}
  .pd-edit{align-self:flex-start;margin-top:5px}
  .dt{font-size:.9rem;color:var(--ink);width:100%;border:1px solid transparent;background:transparent;
    border-radius:8px;padding:6px 8px;margin-left:-8px;font-variant-numeric:tabular-nums}
  .dt:hover{border-color:var(--line)}
  .dt:focus{outline:none;border-color:var(--focus);background:var(--ground);margin-left:0}
  .due-val{font-family:"IBM Plex Mono",ui-monospace,monospace;text-align:right;font-size:.98rem;font-weight:600;
    font-variant-numeric:tabular-nums}
  .due-val.pos{color:var(--due)} .due-val.zero{color:var(--muted)}
  .overdue{font-size:.62rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--due)}
  .row.settled .vend-in,.row.settled .vend-ro{color:var(--muted)}
  .row.settled .cell.vend::after{content:"Paid in full";align-self:flex-start;
    font-size:.58rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);
    background:var(--accent-soft);padding:2px 8px;border-radius:999px}
  .icon-btn{border:1px solid var(--line);background:var(--surface);color:var(--muted);
    width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:.85rem;line-height:1;
    display:inline-grid;place-items:center}
  .icon-btn:hover{color:var(--ink);border-color:var(--muted)}
  .icon-btn.del:hover{color:var(--due);border-color:var(--due)}
  .icon-btn.armed{width:auto;padding:0 10px;background:var(--due);border-color:var(--due);
    color:var(--on-accent);font-size:.62rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase}

  /* ---- payments view ---- */
  .method{display:inline-block;font-size:.62rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;
    padding:2px 7px;vertical-align:middle;margin-left:4px}
  .method-open{border-style:dashed;opacity:.85}
  .pmt-top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;
    background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;
    margin-bottom:14px;box-shadow:var(--shadow)}
  .pmt-top .k{display:block;font-size:.66rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .pmt-total{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:1.6rem;color:var(--accent-ink)}
  .pmt-break{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
  .pmt-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;
    padding:10px 16px;border-top:1px solid var(--line)}
  .pmt-date{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.85rem;color:var(--muted);white-space:nowrap}
  .pmt-vend{font-weight:500;min-width:0}
  .pmt-note{font-size:.78rem;color:var(--muted)}
  .pmt-amt{font-family:"IBM Plex Mono",ui-monospace,monospace;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}

  .toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,12px);opacity:0;
    background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:10px;font-size:.85rem;
    box-shadow:var(--shadow);transition:opacity .25s,transform .25s;z-index:50;pointer-events:none;max-width:90vw}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* ---- passcode gate ---- */
  .is-hidden{display:none!important}
  .lockbtn{background:var(--surface);border:1px solid var(--line);border-radius:8px;
    padding:6px 11px;font-size:.78rem;color:var(--muted);cursor:pointer;white-space:nowrap}
  .lockbtn:hover{color:var(--ink);border-color:var(--muted)}
  .acctchip{display:flex;align-items:center;gap:9px;font-size:.78rem;color:var(--muted);
    max-width:230px;min-width:0}
  .acctchip .acct-email{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #lockCloud{display:flex;flex-direction:column;gap:12px}
  #lockCloud .gbtn{width:100%;height:44px;display:inline-flex;align-items:center;justify-content:center;gap:9px}
  .lock-signed{font-size:.8rem;color:var(--muted);margin:0 0 2px}
  .lock{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px;background:var(--ground)}
  .lock-card{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);
    border-radius:18px;box-shadow:var(--shadow);padding:34px 28px;text-align:center}
  .lock-mark{color:var(--gold);font-size:1.9rem;line-height:1}
  .lock-title{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:1.5rem;
    letter-spacing:-.01em;margin:.45rem 0 .25rem}
  .lock-sub{color:var(--muted);font-size:.88rem;line-height:1.5;margin:0 0 20px;text-wrap:balance}
  #lockForm{display:flex;flex-direction:column;gap:12px}
  #lockForm input[type=password]{background:var(--surface-2);border:1px solid var(--line);
    border-radius:11px;padding:12px 13px;font-size:1rem;text-align:center;letter-spacing:.14em}
  #lockForm input[type=password]::placeholder{letter-spacing:0}
  #lockForm input[type=password]:focus{outline:none;border-color:var(--focus);
    box-shadow:0 0 0 3px var(--accent-soft);background:var(--surface)}
  .lock-remember{display:flex;align-items:center;justify-content:center;gap:8px;
    font-size:.82rem;color:var(--muted)}
  .lock-remember input{width:16px;height:16px;accent-color:var(--accent)}
  #lockForm .btn{width:100%;height:44px}
  .lock-err{color:var(--due);font-size:.82rem;font-weight:600;margin:2px 0 0}
  .lock-reset{margin-top:16px;background:none;border:0;color:var(--muted);font-size:.78rem;
    text-decoration:underline;cursor:pointer}
  .lock-reset.armed{color:var(--due);text-decoration:none;font-weight:600}
  .lock-shake{animation:lockshake .4s}
  @keyframes lockshake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(4px)}50%{transform:translateX(-6px)}}
  @media (prefers-reduced-motion:reduce){.lock-shake{animation:none}}

  .foot{max-width:1080px;margin:0 auto 44px;padding:0 clamp(20px,4vw,38px);font-size:.78rem;color:var(--muted);
    display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
  .foot-actions{display:flex;gap:14px}
  .linkbtn{background:none;border:0;padding:0;color:var(--muted);font-size:.78rem;
    text-decoration:underline;cursor:pointer}
  .linkbtn:hover{color:var(--ink)}

  /* ---- modal ---- */
  .modal{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.45)}
  .modal-card{width:100%;max-width:520px;background:var(--surface);border:1px solid var(--line);
    border-radius:16px;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:12px}
  .modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .modal-head h2{margin:0;font-family:"Fraunces",Georgia,serif;font-weight:500;font-size:1.15rem}
  .modal-sub{margin:0;font-size:.83rem;color:var(--muted);line-height:1.5}
  .modal-text{width:100%;min-height:140px;resize:vertical;font-size:.8rem;line-height:1.5;
    font-family:"IBM Plex Mono",ui-monospace,monospace;background:var(--surface-2);color:var(--ink);
    border:1px solid var(--line);border-radius:10px;padding:10px}
  .modal-text:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px var(--accent-soft)}
  .modal-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .modal-btn{height:38px;padding:0 16px}
  .modal-btn.danger,.modal-btn.armed{background:var(--due)}
  .modal-file{font-size:.8rem;color:var(--muted);max-width:100%}
  #modalBody{display:flex;flex-direction:column;gap:12px;max-height:56vh;overflow:auto}
  .pay-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .pay-row{display:grid;grid-template-columns:1.15fr 1fr .85fr auto;gap:8px;align-items:center;padding:8px 10px;border-top:1px solid var(--line)}
  .pay-row:first-child{border-top:0}
  .pay-add{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pay-add input,.pay-add select,.pay-row input,.pay-row select,.pm-sel{
    background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 9px;font:inherit;color:var(--ink);min-width:0}
  .pay-add input:focus,.pay-add select:focus,.pay-row input:focus,.pay-row select:focus{
    outline:none;border-color:var(--focus);box-shadow:0 0 0 3px var(--accent-soft)}
  .evt-list{display:flex;flex-direction:column;gap:8px}
  .evt-item{display:flex;align-items:center;gap:10px}
  .evt-name{flex:1;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:inherit;color:var(--ink);min-width:0}
  .evt-name:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px var(--accent-soft)}
  .evt-cur{font-size:.64rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent-ink);
    background:var(--accent-soft);border-radius:999px;padding:3px 9px;white-space:nowrap}

  @media (max-width:860px){ .tiles{grid-template-columns:repeat(2,1fr)} }
  @media (max-width:620px){
    .tiles{grid-template-columns:1fr}
    .add-form{grid-template-columns:1fr 1fr}
    .add-form .field:first-child,.add-form .btn{grid-column:1 / -1}
    .pay-add{grid-template-columns:1fr}
    .pay-row{grid-template-columns:1fr 1fr;gap:8px 8px}
    .pay-row .icon-btn{grid-column:2;justify-self:end}
    .pd-row{grid-template-columns:auto 1fr auto;gap:8px}
    .pd-note{display:none}
  }
  @media (max-width:720px){
    .row{grid-template-columns:1fr 1fr;gap:11px 12px;padding:14px 16px}
    .row.head{display:none}
    .cell.vend{grid-column:1 / -1}
    .cell.act{grid-column:1 / -1;justify-content:flex-start}
    .cell.figure{align-items:flex-start;text-align:left}
    .cell::before{content:attr(data-label);display:block;font-size:.62rem;font-weight:700;
      letter-spacing:.07em;text-transform:uppercase;color:var(--ink);opacity:.6;margin-bottom:3px}
    .cell.vend::before,.cell.act::before{display:none}
    .num,.dt{text-align:left;border-color:var(--line);margin:0}
    .num:focus,.dt:focus{margin:0}
    .ro,.pcount-btn{text-align:left}
    .due-val{text-align:left}
    .pmt-row{grid-template-columns:auto 1fr auto}
    .pmt-row .icon-btn{grid-column:1 / -1;justify-self:start}
  }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>

<div id="lock" class="lock">
  <div class="lock-card">
    <div class="lock-mark">&#10022;</div>
    <h1 class="lock-title">Wedding Ledger</h1>
    <p class="lock-sub" id="lockSub">Enter your passcode to continue.</p>
    <div id="lockCloud" class="is-hidden"></div>
    <form id="lockForm" autocomplete="off">
      <input type="password" id="lockPass" placeholder="Passcode" autocomplete="current-password" aria-label="Passcode">
      <input type="password" id="lockPass2" placeholder="Confirm passcode" autocomplete="new-password" aria-label="Confirm passcode" class="is-hidden">
      <label class="lock-remember"><input type="checkbox" id="lockTrust" checked> Trust this device</label>
      <button type="submit" class="btn" id="lockGo">Unlock</button>
      <p class="lock-err is-hidden" id="lockErr" role="alert"></p>
    </form>
    <button type="button" id="lockReset" class="lock-reset is-hidden">Reset passcode</button>
  </div>
</div>

<header class="topbar">
  <div class="brand"><span class="mark">&#10022;</span> Wedding Ledger</div>
  <div class="tools">
    <label class="cur evt"><span>Event</span>
      <select id="eventSel" aria-label="Event dashboard"></select>
    </label>
    <button type="button" id="evtManage" class="lockbtn" title="Manage event dashboards">Manage</button>
    <label class="cur"><span>Currency</span>
      <select id="currency" aria-label="Currency">
        <option value="$">$ USD</option>
        <option value="&#8377;">&#8377; INR</option>
        <option value="&#8364;">&#8364; EUR</option>
        <option value="&#163;">&#163; GBP</option>
        <option value="A$">A$ AUD</option>
        <option value="C$">C$ CAD</option>
      </select>
    </label>
    <button type="button" id="lockBtn" class="lockbtn" title="Lock this page">Lock</button>
    <span id="acctChip" class="acctchip is-hidden">
      <span class="acct-email"></span>
      <button type="button" class="linkbtn" id="signOutBtn">Sign out</button>
    </span>
  </div>
</header>

<main>
  <section id="summary" aria-label="Budget summary"></section>

  <section class="panel">
    <h2 class="sec-h">Add an expense</h2>
    <form id="addForm" class="add-form">
      <div class="field">
        <label for="f-vendor">Vendor / item</label>
        <input id="f-vendor" name="vendor" placeholder="e.g. Rosewood Barn" autocomplete="off" required>
      </div>
      <div class="field">
        <label for="f-cat">Category</label>
        <select id="f-cat" name="category"></select>
      </div>
      <div class="field">
        <label for="f-total">Total cost</label>
        <input id="f-total" name="total" type="number" min="0" step="1" placeholder="0">
      </div>
      <div class="field">
        <label for="f-paid">Paid now</label>
        <input id="f-paid" name="paid" type="number" min="0" step="1" placeholder="0">
      </div>
      <div class="field">
        <label for="f-method">Method</label>
        <select id="f-method" name="method"></select>
      </div>
      <div class="field">
        <label for="f-date">Balance due</label>
        <input id="f-date" name="dueDate" type="date">
      </div>
      <button class="btn" type="submit">Add</button>
    </form>
  </section>

  <section aria-label="Ledger">
    <h2 class="sec-h" id="mainHead">The ledger</h2>
    <div id="controls" class="controls"></div>
    <div id="ledger"></div>
  </section>
</main>

<footer class="foot">
  <span>Every change saves automatically. <span id="saveNote"></span></span>
  <span class="foot-actions">
    <button type="button" class="linkbtn" id="exportBtn">Export backup</button>
    <button type="button" class="linkbtn" id="importBtn">Import backup</button>
  </span>
</footer>

<div id="modal" class="modal is-hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-card">
    <div class="modal-head">
      <h2 id="modalTitle">Backup</h2>
      <button type="button" class="icon-btn" id="modalClose" aria-label="Close">&#10005;</button>
    </div>
    <p class="modal-sub" id="modalSub"></p>
    <div id="modalBody" class="is-hidden"></div>
    <textarea id="modalText" class="modal-text is-hidden" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var CATEGORIES = ["Venue","Catering","Photography & Video","Attire & Beauty","Florals & Decor",
    "Music & Entertainment","Cake & Desserts","Stationery","Rings","Transport","Rentals",
    "Guest Favors","Officiant","Other"];
  var METHODS = ["Cash","Bank transfer","UPI","Cheque","Card","Other"];

  var SAMPLES = [
    {vendor:"Rosewood Barn",        category:"Venue",                total:9000, dueDate:"2026-05-15", payments:[{amount:3000,date:"2026-01-12",method:"Bank transfer"}]},
    {vendor:"Fig & Thyme Catering", category:"Catering",             total:6800, dueDate:"2026-06-01", payments:[{amount:1500,date:"2026-02-04",method:"UPI"}]},
    {vendor:"A. Rivera Photography",category:"Photography & Video",  total:3800, dueDate:"2026-06-10", payments:[{amount:1200,date:"2026-02-21",method:"Card"}]},
    {vendor:"Wildflower Studio",    category:"Florals & Decor",      total:2400, dueDate:"",           payments:[{amount:600,date:"2026-03-02",method:"Cash"}]},
    {vendor:"The Night Owls",       category:"Music & Entertainment",total:2200, dueDate:"2026-06-12", payments:[]},
    {vendor:"Sugarcraft Bakehouse",category:"Cake & Desserts",      total:650,  dueDate:"",           payments:[{amount:650,date:"2026-03-16",method:"Cash"}]}
  ];

  var state = {
    data: { events: [], currentId: "" },
    filter: { category: "all", status: "all" },
    view: "ledger",
    open: {}
  };
  var db = null, mode = "local";
  var cloud = null, applyingRemote = false, fbUser = null, fbAuth = null;

  var summaryEl = document.getElementById("summary");
  var controlsEl = document.getElementById("controls");
  var ledgerEl = document.getElementById("ledger");
  var mainHeadEl = document.getElementById("mainHead");
  var currencySel = document.getElementById("currency");
  var eventSel = document.getElementById("eventSel");
  var saveNote = document.getElementById("saveNote");
  var addForm = document.getElementById("addForm");

  /* ---------- helpers ---------- */
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }
  function uid(p){ return (p || "") + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function todayStr(){
    var d = new Date();
    return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2);
  }
  function curEvent(){
    var d = state.data;
    return d.events.filter(function(e){ return e.id === d.currentId; })[0] || d.events[0] || null;
  }
  function curCurrency(){ var e = curEvent(); return (e && e.currency) || "$"; }
  function money(n){
    n = +n || 0;
    var c = curCurrency();
    var neg = n < 0; n = Math.abs(n);
    var dec = n % 1 ? 2 : 0;
    return (neg ? "−" : "") + c + n.toLocaleString("en-US", { minimumFractionDigits: dec, maximumFractionDigits: 2 });
  }
  function startOfToday(){ var d = new Date(); d.setHours(0, 0, 0, 0); return d; }
  function fmtDate(s){
    if(!s) return "";
    var d = new Date(s + "T00:00");
    if(isNaN(d)) return "";
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }
  function fmtMonth(ym){
    var d = new Date(ym + "-01T00:00");
    if(isNaN(d)) return ym;
    return d.toLocaleDateString(undefined, { month: "long", year: "numeric" });
  }
  function daysToGo(s){
    var d = new Date(s + "T00:00");
    return Math.ceil((d - startOfToday()) / 86400000);
  }
  function paidOf(e){
    if(e.payments && e.payments.length){
      return e.payments.reduce(function(a, p){ return a + (+p.amount || 0); }, 0);
    }
    return +e.paid || 0;
  }
  function dueOf(e){ return Math.max((+e.total || 0) - paidOf(e), 0); }
  function findExpense(id){
    var ev = curEvent();
    if(!ev) return null;
    return ev.expenses.filter(function(e){ return e.id === id; })[0] || null;
  }
  function toast(msg){
    var t = document.createElement("div");
    t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg;
    document.body.appendChild(t);
    requestAnimationFrame(function(){ t.classList.add("show"); });
    setTimeout(function(){ t.classList.remove("show"); setTimeout(function(){ t.remove(); }, 320); }, 2600);
  }
  function effectiveRows(){
    var ev = curEvent();
    if(ev && ev.expenses.length) return ev.expenses;
    return SAMPLES.map(function(s){
      return {
        _sample: true, id: "s" + Math.random().toString(36).slice(2, 8),
        vendor: s.vendor, category: s.category, total: s.total, dueDate: s.dueDate,
        payments: (s.payments || []).map(function(p){ return { amount: p.amount, date: p.date, method: p.method }; })
      };
    });
  }

  /* ---------- normalise / migrate ---------- */
  function normPayment(p){
    p = p || {};
    var method = p.method || "";
    var note = p.note || "";
    // self-heal payments auto-created by an earlier migration
    if((note === "Earlier payments" || note === "Opening balance") && (method === "Other" || method === "")){
      method = ""; note = "Opening balance";
    }
    return {
      id: p.id || uid("pay-"),
      amount: Math.max(0, +p.amount || 0),
      date: p.date || "",
      method: method,
      note: note
    };
  }
  function normExpense(x){
    x = x || {};
    var payments = Array.isArray(x.payments) ? x.payments.map(normPayment) : [];
    if(!payments.length && +x.paid > 0){
      payments = [ normPayment({ amount: +x.paid, date: "", method: "", note: "Opening balance" }) ];
    }
    return {
      id: x.id || uid("exp-"),
      vendor: x.vendor || "",
      category: x.category || "Other",
      total: Math.max(0, +x.total || 0),
      dueDate: x.dueDate || "",
      createdAt: +x.createdAt || Date.now(),
      payments: payments
    };
  }
  function normEvent(e){
    e = e || {};
    return {
      id: e.id || uid("evt-"),
      name: (e.name || "Event").toString().slice(0, 60),
      currency: e.currency || "$",
      budgetTarget: Math.max(0, +e.budgetTarget || 0),
      weddingDate: e.weddingDate || "",
      expenses: (Array.isArray(e.expenses) ? e.expenses : []).map(normExpense)
    };
  }
  function migrateBlob(d){
    d = d || {};
    if(Array.isArray(d.events) && d.events.length){
      var evs = d.events.map(normEvent);
      var cur = evs.filter(function(e){ return e.id === d.currentId; })[0];
      return { events: evs, currentId: cur ? cur.id : evs[0].id };
    }
    if(Array.isArray(d.expenses) && d.expenses.length){
      var s = d.settings || {};
      var ev = normEvent({
        id: "evt-main",
        name: s.eventName || "Wedding",
        currency: s.currency || "$",
        budgetTarget: s.budgetTarget || 0,
        weddingDate: s.weddingDate || "",
        expenses: d.expenses
      });
      return { events: [ev], currentId: ev.id };
    }
    return { events: [], currentId: "" };
  }
  function ensureEvent(){
    var d = state.data;
    if(!d.events.length){
      var e = normEvent({ name: "Wedding" });
      d.events.push(e); d.currentId = e.id;
    }
    if(!d.events.some(function(e){ return e.id === d.currentId; })){
      d.currentId = d.events[0].id;
    }
  }

  /* ---------- persistence ---------- */
  function saveLocal(){
    try{ localStorage.setItem("wedledger.v2", JSON.stringify(state.data)); }catch(e){}
  }
  function loadLocal(){
    var raw = null;
    try{ raw = localStorage.getItem("wedledger.v2"); }catch(e){}
    if(raw){
      try{ state.data = migrateBlob(JSON.parse(raw)); ensureEvent(); saveLocal(); return; }catch(e){}
    }
    var legacy = { expenses: [], settings: {} };
    try{ legacy.expenses = JSON.parse(localStorage.getItem("wedledger.expenses") || "[]"); }catch(e){}
    try{ legacy.settings = JSON.parse(localStorage.getItem("wedledger.settings") || "{}"); }catch(e){}
    if(Array.isArray(legacy.expenses) && legacy.expenses.length){
      state.data = migrateBlob(legacy);
    }
    ensureEvent();
    saveLocal();
  }
  function dbPush(){
    if(!(mode === "db" && db) || applyingRemote) return;
    db.doc("app/v2").set({ events: state.data.events, currentId: state.data.currentId }).catch(function(){});
  }
  function commit(){
    ensureEvent();
    saveLocal();
    if(typeof cloudPush === "function") cloudPush();
    dbPush();
    render();
  }

  /* ---------- mutations ---------- */
  function addExpenseObj(o){
    var ev = curEvent();
    if(!ev) return;
    o.id = uid("exp-");
    o.createdAt = Date.now();
    o.payments = Array.isArray(o.payments) ? o.payments.map(normPayment) : [];
    ev.expenses.push(o);
    commit();
  }
  function patchExpense(id, patch){
    var x = findExpense(id);
    if(!x) return;
    for(var k in patch) x[k] = patch[k];
    commit();
  }
  function removeExpense(id){
    var ev = curEvent();
    if(!ev) return;
    ev.expenses = ev.expenses.filter(function(e){ return e.id !== id; });
    commit();
  }
  function patchEvent(patch){
    var ev = curEvent();
    if(!ev) return;
    for(var k in patch) ev[k] = patch[k];
    commit();
  }
  function addEvent(name){
    var base = curEvent();
    var e = normEvent({ name: name, currency: base ? base.currency : "$" });
    state.data.events.push(e);
    state.data.currentId = e.id;
    state.filter = { category: "all", status: "all" };
    state.view = "ledger";
    commit();
  }
  function deleteEvent(id){
    state.data.events = state.data.events.filter(function(e){ return e.id !== id; });
    if(state.data.currentId === id){
      state.data.currentId = state.data.events[0] ? state.data.events[0].id : "";
    }
    ensureEvent();
    commit();
  }
  function switchEvent(id){
    state.data.currentId = id;
    state.filter = { category: "all", status: "all" };
    state.view = "ledger";
    commit();
  }
  function addPayment(expId, p){
    var x = findExpense(expId);
    if(!x) return;
    x.payments = x.payments || [];
    x.payments.push(normPayment(p));
    commit();
  }
  function patchPayment(expId, payId, patch){
    var x = findExpense(expId);
    if(!x || !x.payments) return;
    var p = x.payments.filter(function(z){ return z.id === payId; })[0];
    if(!p) return;
    for(var k in patch) p[k] = patch[k];
    commit();
  }
  function removePayment(expId, payId){
    var x = findExpense(expId);
    if(!x || !x.payments) return;
    x.payments = x.payments.filter(function(z){ return z.id !== payId; });
    commit();
  }

  /* ---------- render ---------- */
  function render(){
    ensureEvent();
    var ev = curEvent();
    currencySel.value = curCurrency();
    eventSel.innerHTML = state.data.events.map(function(e){
      return '<option value="' + esc(e.id) + '"' + (e.id === state.data.currentId ? " selected" : "") + ">" + esc(e.name) + "</option>";
    }).join("");
    mainHeadEl.textContent = state.view === "payments" ? "Payment history" : "The ledger";
    renderSummary();
    renderControls();
    renderMain();
    saveNote.textContent = (mode === "db" || cloud) ? "Synced across your devices." : "Saved on this device.";
  }

  function renderSummary(){
    var ev = curEvent() || {};
    var rows = effectiveRows();
    var committed = 0, paid = 0, bal = 0;
    rows.forEach(function(e){ committed += (+e.total || 0); paid += paidOf(e); bal += dueOf(e); });
    var budget = +ev.budgetTarget || 0;
    var pct = committed > 0 ? Math.round(paid / committed * 100) : 0;

    var wd = ev.weddingDate || "";
    var dtg = "";
    if(wd){
      var n = daysToGo(wd);
      dtg = n > 0 ? (n + " day" + (n === 1 ? "" : "s") + " to go")
          : n === 0 ? "The big day is here 🎉"
          : (Math.abs(n) + " day" + (Math.abs(n) === 1 ? "" : "s") + " ago");
    }

    var budgetSub;
    if(budget > 0){
      var diff = budget - committed;
      budgetSub = '<span class="' + (diff >= 0 ? "ok" : "over") + '">' +
        money(Math.abs(diff)) + " " + (diff >= 0 ? "under" : "over") +
        " · " + Math.round(committed / budget * 100) + "% committed</span>";
    }else{
      budgetSub = "Set your target budget";
    }

    summaryEl.innerHTML =
      '<div class="wed-row">' +
        '<div class="wed">' +
          '<span class="k">Event date</span>' +
          '<input type="date" id="weddingDate" value="' + esc(wd) + '" aria-label="Event date">' +
          (dtg ? '<span class="dtg">' + esc(dtg) + '</span>' : '') +
        '</div>' +
      '</div>' +
      '<div class="tiles">' +
        '<div class="tile">' +
          '<span class="k">Total budget</span>' +
          '<input class="v" id="budget" type="number" min="0" step="100" value="' + (budget || "") + '" placeholder="&mdash;" aria-label="Total budget">' +
          '<span class="s">' + budgetSub + '</span>' +
        '</div>' +
        '<div class="tile">' +
          '<span class="k">Committed</span>' +
          '<span class="v">' + money(committed) + '</span>' +
          '<span class="s">' + rows.length + (rows.length === 1 ? " expense" : " expenses") + '</span>' +
        '</div>' +
        '<div class="tile paid">' +
          '<span class="k">Paid so far</span>' +
          '<span class="v">' + money(paid) + '</span>' +
          '<span class="s">' + pct + '% of committed</span>' +
        '</div>' +
        '<div class="tile due">' +
          '<span class="k">Outstanding</span>' +
          '<span class="v">' + money(bal) + '</span>' +
          '<span class="s">balance still due</span>' +
        '</div>' +
      '</div>' +
      '<div class="meter-wrap">' +
        '<div class="meter-label"><span>Payment progress</span><span>' + pct + '%</span></div>' +
        '<div class="meter"><div class="meter-fill" style="width:' + Math.min(pct, 100) + '%"></div></div>' +
        '<div class="meter-sub">' + money(paid) + ' paid of ' + money(committed) + ' · ' + money(bal) + ' to go</div>' +
      '</div>';
  }

  function renderControls(){
    var viewChips = [["ledger", "Ledger"], ["payments", "Payments"]].map(function(p){
      return '<button class="chip" data-act="fview" data-v="' + p[0] + '" aria-pressed="' +
        (state.view === p[0]) + '">' + p[1] + '</button>';
    }).join("");

    if(state.view !== "ledger"){
      controlsEl.innerHTML = '<div class="chips">' + viewChips + '</div>';
      return;
    }

    var rows = effectiveRows();
    var present = [];
    rows.forEach(function(e){ var c = e.category || "Other"; if(present.indexOf(c) < 0) present.push(c); });
    var ordered = CATEGORIES.filter(function(c){ return present.indexOf(c) >= 0; })
      .concat(present.filter(function(c){ return CATEGORIES.indexOf(c) < 0; }));

    var catChips = ["all"].concat(ordered).map(function(c){
      return '<button class="chip" data-act="fcat" data-v="' + esc(c) + '" aria-pressed="' +
        (state.filter.category === c) + '">' + (c === "all" ? "All categories" : esc(c)) + '</button>';
    }).join("");

    var statusChips = [["all", "All"], ["outstanding", "Outstanding"], ["settled", "Settled"]].map(function(p){
      return '<button class="chip" data-act="fstatus" data-v="' + p[0] + '" aria-pressed="' +
        (state.filter.status === p[0]) + '">' + p[1] + '</button>';
    }).join("");

    controlsEl.innerHTML =
      '<div class="chips">' + viewChips + '</div>' +
      '<div class="chips">' + catChips + '</div>' +
      '<div class="chips">' + statusChips + '</div>';
  }

  function renderMain(){
    if(state.view === "payments") renderPayments();
    else renderLedger();
  }

  function passFilter(e){
    if(state.filter.category !== "all" && (e.category || "Other") !== state.filter.category) return false;
    var d = dueOf(e);
    if(state.filter.status === "outstanding" && d <= 0) return false;
    if(state.filter.status === "settled" && !(d <= 0 && (+e.total || 0) > 0)) return false;
    return true;
  }

  function rowHTML(e){
    var total = +e.total || 0, pd = paidOf(e), d = Math.max(total - pd, 0);
    var settled = d <= 0 && total > 0;
    var np = (e.payments || []).length;
    var pcount = np ? (np + (np === 1 ? " payment" : " payments")) : "no payments";
    var overdue = e.dueDate && d > 0 && new Date(e.dueDate + "T00:00") < startOfToday();

    var pcls = pd > 0 ? "ro" : "ro zero";

    if(e._sample){
      return '<div class="row' + (settled ? " settled" : "") + '">' +
        '<div class="cell vend"><span class="vend-ro">' + esc(e.vendor) + '</span></div>' +
        '<div class="cell figure" data-label="Total"><span class="ro">' + money(total) + '</span></div>' +
        '<div class="cell figure" data-label="Paid"><span class="' + pcls + '">' + money(pd) + '</span>' +
          '<span class="pcount-btn" style="cursor:default"><span class="chev">&#9656;</span>' + pcount + '</span>' +
        '</div>' +
        '<div class="cell due-val ' + (d > 0 ? "pos" : "zero") + '" data-label="Due">' + money(d) + '</div>' +
        '<div class="cell" data-label="Due date"><span class="dt" style="display:inline-block">' + (fmtDate(e.dueDate) || "—") + '</span></div>' +
        '<div class="cell act"></div>' +
      '</div>';
    }

    return '<div class="row' + (settled ? " settled" : "") + '" data-id="' + e.id + '">' +
      '<div class="cell vend">' +
        '<input class="vend-in" data-id="' + e.id + '" data-field="vendor" value="' + esc(e.vendor) + '" aria-label="Vendor or item">' +
        (overdue ? '<span class="overdue">Overdue · was ' + esc(fmtDate(e.dueDate)) + '</span>' : '') +
      '</div>' +
      '<div class="cell figure" data-label="Total">' +
        '<input class="num" type="text" inputmode="decimal" data-id="' + e.id + '" data-field="total" value="' + (total ? total.toLocaleString("en-US") : "0") + '" aria-label="Total cost">' +
      '</div>' +
      '<div class="cell figure" data-label="Paid">' +
        '<span class="' + pcls + '">' + money(pd) + '</span>' +
        '<button class="pcount-btn" data-act="toggle" data-id="' + e.id + '" aria-expanded="' + (state.open[e.id] ? "true" : "false") + '">' +
          '<span class="chev">&#9656;</span>' + pcount +
        '</button>' +
      '</div>' +
      '<div class="cell due-val ' + (d > 0 ? "pos" : "zero") + '" data-label="Due">' + money(d) + '</div>' +
      '<div class="cell" data-label="Due date"><input class="dt" type="date" data-id="' + e.id + '" data-field="dueDate" value="' + esc(e.dueDate || "") + '" aria-label="Balance due date"></div>' +
      '<div class="cell act">' +
        '<button class="icon-btn" data-act="pay" data-id="' + e.id + '" title="Payments" aria-label="Payments">＋</button>' +
        '<button class="icon-btn del" data-act="del" data-id="' + e.id + '" title="Delete" aria-label="Delete expense">✕</button>' +
      '</div>' +
    '</div>';
  }

  function detailHTML(e){
    if(e._sample || !state.open[e.id]) return "";
    var pays = (e.payments || []).slice().sort(function(a, b){ return (a.date || "").localeCompare(b.date || ""); });
    var inner = pays.length ? pays.map(function(p){
      return '<div class="pd-row">' +
        '<span class="pd-date">' + (p.date ? esc(fmtDate(p.date)) : "—") + '</span>' +
        '<span class="method' + (p.method ? "" : " method-open") + '" style="margin:0">' + esc(p.method || "opening") + '</span>' +
        (p.note && p.note !== "Opening balance" ? '<span class="pd-note">' + esc(p.note) + '</span>' : '<span></span>') +
        '<span class="pd-amt">' + money(+p.amount || 0) + '</span>' +
      '</div>';
    }).join("") : '<div class="pd-empty">No payments recorded yet.</div>';
    return '<div class="row-detail">' + inner +
      '<button type="button" class="linkbtn pd-edit" data-act="pay" data-id="' + e.id + '">Add / edit payments</button>' +
    '</div>';
  }

  function renderLedger(){
    var all = effectiveRows();
    var isSample = all.length && all[0]._sample;
    var rows = all.filter(passFilter);
    var html = isSample
      ? '<p class="sample-note">These are sample entries. Add your first expense above and they clear automatically.</p>'
      : '';

    if(!rows.length){
      ledgerEl.innerHTML = html + '<p class="empty">No expenses match this filter.</p>';
      return;
    }

    var groups = {};
    rows.forEach(function(e){
      var c = e.category || "Other";
      (groups[c] = groups[c] || []).push(e);
    });
    var order = CATEGORIES.filter(function(c){ return groups[c]; })
      .concat(Object.keys(groups).filter(function(c){ return CATEGORIES.indexOf(c) < 0; }));

    html += order.map(function(cat){
      var list = groups[cat];
      var gd = list.reduce(function(a, e){ return a + dueOf(e); }, 0);
      return '<div class="group">' +
        '<div class="group-h">' +
          '<h3>' + esc(cat) + '</h3>' +
          '<span class="gc">' + list.length + (list.length === 1 ? " item" : " items") + '</span>' +
          (gd > 0 ? '<span class="gd">' + money(gd) + ' due</span>'
                  : '<span class="gd zero">Settled</span>') +
        '</div>' +
        '<div class="row head" aria-hidden="true"><span>Vendor / item</span><span>Total</span><span>Paid</span><span>Due</span><span>Due date</span><span></span></div>' +
        list.map(function(e){ return rowHTML(e) + detailHTML(e); }).join("") +
      '</div>';
    }).join("");

    ledgerEl.innerHTML = html;
  }

  function renderPayments(){
    var rows = effectiveRows();
    var isSample = rows.length && rows[0]._sample;
    var pays = [];
    rows.forEach(function(e){
      (e.payments || []).forEach(function(p){
        pays.push({
          amount: +p.amount || 0, date: p.date || "", method: p.method || "", note: p.note || "",
          vendor: e.vendor, expId: e.id, payId: p.id, _sample: e._sample
        });
      });
    });

    if(!pays.length){
      ledgerEl.innerHTML = '<p class="empty">No payments recorded yet. Open a ledger row (＋) to add one.</p>';
      return;
    }

    pays.sort(function(a, b){ return (b.date || "").localeCompare(a.date || ""); });
    var total = pays.reduce(function(a, p){ return a + p.amount; }, 0);
    var byM = {};
    pays.forEach(function(p){ byM[p.method] = (byM[p.method] || 0) + p.amount; });
    var breakdown = Object.keys(byM).map(function(m){
      return '<span><span class="method' + (m ? "" : " method-open") + '" style="margin:0">' + esc(m || "opening") + '</span> ' + money(byM[m]) + '</span>';
    }).join("");

    var groups = {};
    pays.forEach(function(p){
      var key = /^\d{4}-\d{2}/.test(p.date) ? p.date.slice(0, 7) : "0000-00";
      (groups[key] = groups[key] || []).push(p);
    });
    var keys = Object.keys(groups).sort().reverse();

    var html = (isSample ? '<p class="sample-note">Sample payments. Add your own from a ledger row.</p>' : '') +
      '<div class="pmt-top">' +
        '<div><span class="k">Total paid</span><span class="pmt-total">' + money(total) + '</span></div>' +
        '<div class="pmt-break">' + breakdown + '</div>' +
      '</div>';

    html += keys.map(function(k){
      var list = groups[k];
      var sub = list.reduce(function(a, p){ return a + p.amount; }, 0);
      var label = k === "0000-00" ? "No date" : fmtMonth(k);
      return '<div class="group">' +
        '<div class="group-h"><h3>' + esc(label) + '</h3>' +
          '<span class="gd" style="color:var(--accent-ink)">' + money(sub) + '</span></div>' +
        list.map(function(p){
          return '<div class="pmt-row">' +
            '<span class="pmt-date">' + (p.date ? esc(fmtDate(p.date)) : "—") + '</span>' +
            '<span class="pmt-vend">' + esc(p.vendor || "—") + '<span class="method' + (p.method ? "" : " method-open") + '">' + esc(p.method || "opening") + '</span>' +
              (p.note && p.note !== "Opening balance" ? ' <span class="pmt-note">' + esc(p.note) + '</span>' : '') + '</span>' +
            '<span class="pmt-amt">' + money(p.amount) + '</span>' +
            (p._sample ? '<span></span>'
              : '<button class="icon-btn del" data-act="delpay" data-id="' + p.expId + '" data-pay="' + p.payId + '" title="Delete payment" aria-label="Delete payment">✕</button>') +
          '</div>';
        }).join("") +
      '</div>';
    }).join("");

    ledgerEl.innerHTML = html;
  }

  /* ---------- modal ---------- */
  var modal = document.getElementById("modal");
  var modalTitle = document.getElementById("modalTitle");
  var modalSub = document.getElementById("modalSub");
  var modalBody = document.getElementById("modalBody");
  var modalText = document.getElementById("modalText");
  var modalActions = document.getElementById("modalActions");

  function mkbtn(label, fn){
    var b = document.createElement("button");
    b.type = "button"; b.className = "btn modal-btn"; b.textContent = label;
    b.addEventListener("click", fn);
    return b;
  }
  function blobDownload(fname, text){
    try{
      var blob = new Blob([text], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = fname;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    }catch(e){ toast("Download isn't available here — copy the text instead."); }
  }
  function openModal(title, sub){
    modalTitle.textContent = title;
    modalSub.textContent = sub || "";
    modalActions.innerHTML = "";
    modalBody.innerHTML = ""; modalBody.classList.add("is-hidden"); modalBody.__redraw = null;
    modalText.classList.add("is-hidden"); modalText.value = ""; modalText.readOnly = false;
    modal.classList.remove("is-hidden");
  }
  function closeModal(){
    modal.classList.add("is-hidden");
    modalActions.innerHTML = ""; modalBody.innerHTML = ""; modalBody.__redraw = null;
    modalText.value = ""; modalText.readOnly = false;
  }
  function useText(){ modalText.classList.remove("is-hidden"); }
  function useBody(){ modalBody.classList.remove("is-hidden"); }

  document.getElementById("modalClose").addEventListener("click", closeModal);
  modal.addEventListener("click", function(e){ if(e.target === modal) closeModal(); });
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape" && !modal.classList.contains("is-hidden")) closeModal();
  });
  modalBody.addEventListener("change", function(ev){
    var t = ev.target;
    var payRow = t.closest(".pay-row");
    if(payRow){
      var list = payRow.closest(".pay-list");
      var expId = list && list.getAttribute("data-exp");
      var payId = payRow.getAttribute("data-pay");
      var pf = t.getAttribute("data-pf");
      if(expId && payId && pf){
        var v = t.value;
        if(pf === "amount") v = Math.max(0, +v || 0);
        var patch = {}; patch[pf] = v;
        if(pf === "method" && v) patch.note = "";
        patchPayment(expId, payId, patch);
        openPaymentsModal(expId);
      }
      return;
    }
    var evtItem = t.closest(".evt-item");
    if(evtItem && t.getAttribute("data-ef") === "name"){
      var id = evtItem.getAttribute("data-id");
      var e = state.data.events.filter(function(x){ return x.id === id; })[0];
      if(e){ e.name = (t.value || "Event").slice(0, 60); commit(); }
    }
  });

  /* ---------- payments modal ---------- */
  function openPaymentsModal(expId){
    var x = findExpense(expId);
    if(!x){ toast("Add this expense first, then record payments."); return; }
    var total = +x.total || 0, pd = paidOf(x), d = Math.max(total - pd, 0);
    openModal("Payments · " + x.vendor,
      "Total " + money(total) + "   ·   Paid " + money(pd) + "   ·   Due " + money(d));
    useBody();

    var pays = (x.payments || []).slice().sort(function(a, b){ return (a.date || "").localeCompare(b.date || ""); });
    var listHtml = pays.length ? pays.map(function(p){
      return '<div class="pay-row" data-pay="' + p.id + '">' +
        '<input class="dt" type="date" data-pf="date" value="' + esc(p.date || "") + '" aria-label="Payment date">' +
        '<select data-pf="method" aria-label="Method">' +
          (METHODS.indexOf(p.method) < 0 ? '<option value="" selected>Opening balance</option>' : '') +
          METHODS.map(function(m){ return '<option value="' + esc(m) + '"' + (m === p.method ? " selected" : "") + ">" + esc(m) + "</option>"; }).join("") +
        '</select>' +
        '<input class="num" type="number" min="0" step="1" data-pf="amount" value="' + (+p.amount || 0) + '" aria-label="Amount">' +
        '<button class="icon-btn del" data-act="delpay" data-id="' + x.id + '" data-pay="' + p.id + '" title="Delete payment" aria-label="Delete payment">✕</button>' +
      '</div>';
    }).join("") : '<p class="empty" style="padding:14px 0">No payments yet.</p>';

    modalBody.innerHTML =
      '<div class="pay-list" data-exp="' + x.id + '">' + listHtml + '</div>' +
      '<div>' +
        '<p class="modal-sub" style="margin-bottom:8px">Add a payment</p>' +
        '<div class="pay-add">' +
          '<input id="pa-amt" type="number" min="0" step="1" placeholder="Amount" value="' + (d > 0 ? d : "") + '" aria-label="New payment amount">' +
          '<input id="pa-date" type="date" value="' + todayStr() + '" aria-label="New payment date">' +
          '<select id="pa-method" aria-label="New payment method">' +
            METHODS.map(function(m){ return '<option value="' + esc(m) + '">' + esc(m) + "</option>"; }).join("") +
          '</select>' +
          '<input id="pa-note" placeholder="Note (optional)" aria-label="Note">' +
        '</div>' +
      '</div>';

    modalActions.appendChild(mkbtn("Add payment", function(){
      var amt = Math.max(0, +document.getElementById("pa-amt").value || 0);
      if(!amt){ toast("Enter an amount."); return; }
      addPayment(x.id, {
        amount: amt,
        date: document.getElementById("pa-date").value || "",
        method: document.getElementById("pa-method").value || "Other",
        note: (document.getElementById("pa-note").value || "").slice(0, 120)
      });
      openPaymentsModal(x.id);
    }));
    if(d > 0){
      var b = mkbtn("Pay remaining (" + money(d) + ")", function(){
        addPayment(x.id, { amount: d, date: todayStr(), method: document.getElementById("pa-method").value || "Other", note: "" });
        openPaymentsModal(x.id);
      });
      b.classList.remove("btn"); b.className = "linkbtn"; b.style.marginLeft = "4px";
      modalActions.appendChild(b);
    }
  }

  /* ---------- manage events modal ---------- */
  function openEventsModal(){
    openModal("Event dashboards", "Switch between events, rename them, or remove one.");
    useBody();
    function draw(){
      modalBody.innerHTML =
        '<div class="evt-list">' + state.data.events.map(function(e){
          var isCur = e.id === state.data.currentId;
          return '<div class="evt-item" data-id="' + esc(e.id) + '">' +
            '<input class="evt-name" data-ef="name" value="' + esc(e.name) + '" aria-label="Event name">' +
            (isCur ? '<span class="evt-cur">current</span>'
                   : '<button type="button" class="linkbtn" data-act="evtswitch" data-id="' + esc(e.id) + '">Switch</button>') +
            (state.data.events.length > 1
              ? '<button type="button" class="icon-btn del" data-act="evtdel" data-id="' + esc(e.id) + '" title="Delete this dashboard" aria-label="Delete dashboard">✕</button>'
              : '') +
          '</div>';
        }).join("") + '</div>' +
        '<div>' +
          '<p class="modal-sub" style="margin-bottom:8px">New dashboard</p>' +
          '<div class="pay-add" style="grid-template-columns:1fr"><input id="ev-new" placeholder="e.g. Reception, Mehndi, Engagement" aria-label="New event name"></div>' +
        '</div>';
      modalActions.innerHTML = "";
      modalActions.appendChild(mkbtn("Add dashboard", function(){
        var n = (document.getElementById("ev-new").value || "").trim();
        if(!n){ toast("Enter a name."); return; }
        addEvent(n);
        closeModal();
        toast("Now showing “" + n + "”.");
      }));
      modalBody.__redraw = draw;
    }
    draw();
  }

  /* ---------- backup ---------- */
  function backupData(){
    return {
      app: "wedding-ledger", version: 2, exportedAt: new Date().toISOString(),
      events: state.data.events.map(normEvent),
      currentId: state.data.currentId
    };
  }
  function doExport(){
    var json = JSON.stringify(backupData(), null, 2);
    var n = state.data.events.reduce(function(a, e){ return a + e.expenses.length; }, 0);
    var sub = "Copy this text somewhere safe, or download it. Use “Import backup” on another device to restore everything (all event dashboards).";
    if(!n) sub += " Note: no expenses saved yet, so this backup is empty.";
    openModal("Export backup", sub);
    useText();
    modalText.readOnly = true;
    modalText.value = json;
    modalActions.appendChild(mkbtn("Copy", function(){
      var ok = false;
      try{ modalText.focus(); modalText.select(); ok = document.execCommand("copy"); }catch(e){}
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(json).then(
          function(){ toast("Backup copied."); },
          function(){ toast(ok ? "Backup copied." : "Select the text and copy it."); }
        );
      }else{
        toast(ok ? "Backup copied." : "Select the text and copy it.");
      }
    }));
    modalActions.appendChild(mkbtn("Download .json", function(){
      var fname = "wedding-ledger-backup-" + todayStr() + ".json";
      if(window.claude && typeof window.claude.use === "function"){
        window.claude.use("downloads").then(function(dl){
          if(dl && dl.save){
            dl.save({ filename: fname, data: json }).then(
              function(){ toast("Backup saved."); },
              function(err){ toast(err && err.code === "declined" ? "Download cancelled." : "Couldn't save — copy the text instead."); }
            );
          }else{ blobDownload(fname, json); }
        }, function(){ blobDownload(fname, json); });
      }else{ blobDownload(fname, json); }
    }));
  }
  function doImport(){
    openModal("Import backup",
      "Paste a backup below, or choose a .json file. This replaces every event dashboard on this device — your passcode is kept.");
    useText();
    modalText.readOnly = false;
    modalText.value = "";
    modalText.placeholder = '{ "app": "wedding-ledger", ... }';

    var file = document.createElement("input");
    file.type = "file"; file.accept = "application/json,.json"; file.className = "modal-file";
    file.addEventListener("change", function(){
      var f = file.files && file.files[0]; if(!f) return;
      var r = new FileReader();
      r.onload = function(){ modalText.value = String(r.result || ""); };
      r.readAsText(f);
    });
    modalActions.appendChild(file);

    var restore = mkbtn("Restore", function(){
      var data;
      try{ data = JSON.parse(modalText.value); }
      catch(e){ toast("That doesn't look like valid backup text."); return; }
      if(!data || data.app !== "wedding-ledger" || !(Array.isArray(data.events) || Array.isArray(data.expenses))){
        toast("Unrecognised backup format."); return;
      }
      if(restore.getAttribute("data-armed") !== "1"){
        restore.setAttribute("data-armed", "1");
        restore.classList.add("armed");
        restore.textContent = "Replace everything — tap again";
        setTimeout(function(){
          restore.removeAttribute("data-armed");
          restore.classList.remove("armed");
          restore.textContent = "Restore";
        }, 4000);
        return;
      }
      state.data = migrateBlob(data);
      ensureEvent();
      commit();
      closeModal();
      toast("Backup restored.");
    });
    restore.classList.add("danger");
    modalActions.appendChild(restore);
  }

  /* ---------- wire static controls ---------- */
  CATEGORIES.forEach(function(c){
    var o = document.createElement("option");
    o.value = c; o.textContent = c;
    document.getElementById("f-cat").appendChild(o);
  });
  METHODS.forEach(function(m){
    var o = document.createElement("option");
    o.value = m; o.textContent = m;
    document.getElementById("f-method").appendChild(o);
  });

  addForm.addEventListener("submit", function(ev){
    ev.preventDefault();
    var fd = new FormData(addForm);
    var vendor = (fd.get("vendor") || "").trim();
    if(!vendor) return;
    var paidNow = Math.max(0, +fd.get("paid") || 0);
    var o = {
      vendor: vendor,
      category: fd.get("category") || "Other",
      total: Math.max(0, +fd.get("total") || 0),
      dueDate: fd.get("dueDate") || "",
      payments: []
    };
    if(paidNow > 0){
      o.payments.push(normPayment({ amount: paidNow, date: todayStr(), method: fd.get("method") || "Other" }));
    }
    addExpenseObj(o);
    addForm.reset();
    document.getElementById("f-vendor").focus();
  });

  ledgerEl.addEventListener("change", function(ev){
    var t = ev.target;
    var id = t.getAttribute("data-id"), f = t.getAttribute("data-field");
    if(!id || !f) return;
    var val = t.value;
    if(f === "total") val = Math.max(0, +String(val).replace(/[^0-9.]/g, "") || 0);
    if(f === "vendor"){ val = val.trim(); if(!val){ render(); return; } }
    var patch = {}; patch[f] = val;
    patchExpense(id, patch);
  });

  summaryEl.addEventListener("change", function(ev){
    var t = ev.target;
    if(t.id === "budget") patchEvent({ budgetTarget: Math.max(0, +t.value || 0) });
    if(t.id === "weddingDate") patchEvent({ weddingDate: t.value });
  });

  currencySel.addEventListener("change", function(){ patchEvent({ currency: currencySel.value }); });
  eventSel.addEventListener("change", function(){ switchEvent(eventSel.value); });
  document.getElementById("evtManage").addEventListener("click", openEventsModal);
  document.getElementById("exportBtn").addEventListener("click", doExport);
  document.getElementById("importBtn").addEventListener("click", doImport);

  document.addEventListener("click", function(ev){
    var b = ev.target.closest("[data-act]");
    if(!b) return;
    var act = b.getAttribute("data-act");
    if(act === "del"){
      if(b.getAttribute("data-armed") === "1"){
        removeExpense(b.getAttribute("data-id"));
      }else{
        b.setAttribute("data-armed", "1");
        b.classList.add("armed");
        b.textContent = "Delete?";
        b.setAttribute("title", "Click again to remove");
        clearTimeout(b._revert);
        b._revert = setTimeout(function(){
          b.removeAttribute("data-armed");
          b.classList.remove("armed");
          b.textContent = "✕";
          b.setAttribute("title", "Delete");
        }, 3500);
      }
    }else if(act === "pay"){
      openPaymentsModal(b.getAttribute("data-id"));
    }else if(act === "toggle"){
      var tid = b.getAttribute("data-id");
      state.open[tid] = !state.open[tid];
      renderMain();
    }else if(act === "delpay"){
      removePayment(b.getAttribute("data-id"), b.getAttribute("data-pay"));
      if(!modal.classList.contains("is-hidden")) openPaymentsModal(b.getAttribute("data-id"));
    }else if(act === "fcat"){
      state.filter.category = b.getAttribute("data-v"); renderControls(); renderMain();
    }else if(act === "fstatus"){
      state.filter.status = b.getAttribute("data-v"); renderControls(); renderMain();
    }else if(act === "fview"){
      state.view = b.getAttribute("data-v"); render();
    }else if(act === "evtswitch"){
      switchEvent(b.getAttribute("data-id")); closeModal();
    }else if(act === "evtdel"){
      if(b.getAttribute("data-armed") === "1"){
        deleteEvent(b.getAttribute("data-id"));
        if(modalBody.__redraw) modalBody.__redraw();
      }else{
        b.setAttribute("data-armed", "1");
        b.classList.add("armed");
        b.textContent = "Delete?";
        setTimeout(function(){
          b.removeAttribute("data-armed"); b.classList.remove("armed"); b.textContent = "✕";
        }, 3500);
      }
    }
  });

  /* ---------- cloud sync (Firebase — standalone build, optional) ---------- */
  function firebaseConfigured(){
    var c = window.FIREBASE_CONFIG;
    return !!(c && c.apiKey && c.projectId && c.appId && c.authDomain);
  }
  function loadFirebase(cb){
    if(window.firebase && window.firebase.firestore){ cb(); return; }
    var base = "https://www.gstatic.com/firebasejs/10.14.1/";
    var files = ["firebase-app-compat.js", "firebase-auth-compat.js", "firebase-firestore-compat.js"];
    (function next(i){
      if(i >= files.length){ cb(); return; }
      var s = document.createElement("script");
      s.src = base + files[i]; s.async = false;
      s.onload = function(){ next(i + 1); };
      s.onerror = function(){ cb(new Error("Could not load the sync library.")); };
      document.head.appendChild(s);
    })(0);
  }
  function applyRemote(d){
    if(!d) return;
    if(!(Array.isArray(d.events) || Array.isArray(d.expenses))) return;
    applyingRemote = true;
    state.data = migrateBlob(d);
    ensureEvent();
    saveLocal();
    render();
    applyingRemote = false;
  }
  var pendingLocal = 0;
  function cloudPayload(){
    var p = {
      events: state.data.events,
      currentId: state.data.currentId,
      updatedAt: Date.now()
    };
    // remove pre-events legacy keys so older cached clients can't read stale data
    try{
      var del = window.firebase.firestore.FieldValue.delete();
      p.expenses = del; p.settings = del;
    }catch(e){}
    return p;
  }
  function flushCloud(){
    if(!cloud) return;
    clearTimeout(cloud.t); cloud.t = null;
    var stamp = Date.now();
    cloud.ref.set(cloudPayload(), { merge: true })
      .then(function(){ if(pendingLocal && pendingLocal <= stamp) pendingLocal = 0; })
      .catch(function(){ toast("Sync failed — your change is saved on this device."); });
  }
  function cloudPush(){
    if(!cloud || applyingRemote) return;
    pendingLocal = Date.now();
    clearTimeout(cloud.t);
    cloud.t = setTimeout(flushCloud, 700);
  }
  function startCloud(uid2, preSnap){
    cloud = { ref: window.firebase.firestore().doc("wallets/" + uid2), t: null };
    function handle(snap){
      var d = snap && snap.exists ? snap.data() : null;
      var hasRemote = d && (Array.isArray(d.events) && d.events.length || Array.isArray(d.expenses) && d.expenses.length);
      var hasLocal = state.data.events.some(function(e){ return e.expenses.length; });
      if(hasRemote){
        applyRemote(d);
      }else if(hasLocal || state.data.events.length > 1){
        cloud.ref.set(cloudPayload(), { merge: true })
          .then(function(){ toast("This device's budget is now synced to your account."); })
          .catch(function(){});
      }
      cloud.ref.onSnapshot(function(s){
        if(!s.exists) return;
        if(s.metadata && s.metadata.hasPendingWrites) return;
        if(pendingLocal && (Date.now() - pendingLocal) < 6000) return;
        applyRemote(s.data());
      }, function(){});
    }
    if(preSnap){ handle(preSnap); }
    else{ cloud.ref.get().then(handle, function(){ toast("Couldn't reach sync — showing this device's data."); }); }
  }
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "hidden" && cloud && cloud.t) flushCloud();
  });
  window.addEventListener("pagehide", function(){ if(cloud && cloud.t) flushCloud(); });
  function showAccount(user){
    var lb = document.getElementById("lockBtn");
    var chip = document.getElementById("acctChip");
    if(lb) lb.classList.add("is-hidden");
    if(chip){
      chip.classList.remove("is-hidden");
      chip.querySelector(".acct-email").textContent = user.email || "Signed in";
    }
  }
  (function wireSignOut(){
    var so = document.getElementById("signOutBtn");
    if(!so) return;
    so.addEventListener("click", function(){
      try{ window.firebase.auth().signOut().then(function(){ location.reload(); }, function(){ location.reload(); }); }
      catch(e){ location.reload(); }
    });
  })();

  function firebaseGate(){
    var lockEl = document.getElementById("lock");
    var cloudBox = document.getElementById("lockCloud");
    var formEl = document.getElementById("lockForm");
    var resetEl = document.getElementById("lockReset");
    var subEl = document.getElementById("lockSub");
    var cardEl = lockEl.querySelector(".lock-card");
    var passEl = document.getElementById("lockPass");
    var pass2El = document.getElementById("lockPass2");
    var trustEl = document.getElementById("lockTrust");
    var goEl = document.getElementById("lockGo");
    var errEl = document.getElementById("lockErr");

    formEl.classList.add("is-hidden");
    resetEl.classList.add("is-hidden");
    cloudBox.classList.remove("is-hidden");

    function shake(msg){
      errEl.textContent = msg; errEl.classList.remove("is-hidden");
      cardEl.classList.remove("lock-shake"); void cardEl.offsetWidth; cardEl.classList.add("lock-shake");
    }
    function signOut(){
      if(fbAuth) fbAuth.signOut().then(function(){ location.reload(); }, function(){ location.reload(); });
      else location.reload();
    }
    function wireOut(scope){
      (scope || document).querySelectorAll("[data-signout]").forEach(function(b){ b.onclick = signOut; });
    }

    function showGoogle(msg){
      subEl.textContent = "Sign in to open your wedding ledger.";
      formEl.classList.add("is-hidden");
      resetEl.classList.add("is-hidden");
      cloudBox.classList.remove("is-hidden");
      cloudBox.innerHTML =
        '<button type="button" class="btn gbtn" id="gBtn">Sign in with Google</button>' +
        '<p class="lock-err is-hidden" id="gErr" role="alert"></p>' +
        '<button type="button" class="lock-reset" id="gLocal" style="display:block">Use on this device only</button>';
      var gBtn = document.getElementById("gBtn");
      var gErr = document.getElementById("gErr");
      if(msg){ gErr.textContent = msg; gErr.classList.remove("is-hidden"); }
      document.getElementById("gLocal").onclick = function(){
        window.__localOnly = true;
        cloudBox.classList.add("is-hidden");
        formEl.classList.remove("is-hidden");
        gate();
      };
      gBtn.onclick = function(){
        gErr.classList.add("is-hidden");
        if(!window.firebase || !fbAuth){ firebaseGate(); return; }
        var prov = new window.firebase.auth.GoogleAuthProvider();
        fbAuth.signInWithPopup(prov).catch(function(e){
          var code = e && e.code;
          if(code === "auth/popup-closed-by-user" || code === "auth/cancelled-popup-request") return;
          if(code === "auth/popup-blocked" || code === "auth/operation-not-supported-in-this-environment"){
            fbAuth.signInWithRedirect(prov); return;
          }
          gErr.textContent = (e && e.message) || "Sign-in failed.";
          gErr.classList.remove("is-hidden");
        });
      };
    }

    function showDenied(user){
      formEl.classList.add("is-hidden");
      resetEl.classList.add("is-hidden");
      cloudBox.classList.remove("is-hidden");
      subEl.textContent = "";
      cloudBox.innerHTML =
        '<p class="lock-sub">This ledger is private. The account <b>' + esc(user.email || "") +
        '</b> is not on the allow list.</p>' +
        '<button type="button" class="btn gbtn" data-signout>Sign out</button>';
      wireOut(cloudBox);
    }

    function enterApp(user, ref, snap){
      lockEl.classList.add("is-hidden");
      formEl.classList.add("is-hidden");
      showAccount(user);
      if(!appStarted){ appStarted = true; startApp(); }
      startCloud(user.uid, snap);
    }

    function passcodeStep(user, ref, existingHash, snap){
      if(existingHash && lsGet("wedledger.cloudTrust") === existingHash){
        enterApp(user, ref, snap); return;
      }
      var makeNew = !existingHash;
      cloudBox.classList.remove("is-hidden");
      cloudBox.innerHTML = '<p class="lock-signed">Signed in as ' + esc(user.email || "") +
        ' &middot; <button type="button" class="linkbtn" data-signout>Sign out</button></p>';
      wireOut(cloudBox);
      formEl.classList.remove("is-hidden");
      errEl.classList.add("is-hidden");
      passEl.value = ""; pass2El.value = "";
      if(makeNew){
        subEl.textContent = "Create a passcode. You'll use it to open the ledger from now on.";
        passEl.placeholder = "New passcode";
        pass2El.classList.remove("is-hidden");
        goEl.textContent = "Set passcode";
        resetEl.classList.add("is-hidden");
      }else{
        subEl.textContent = "Enter your passcode.";
        passEl.placeholder = "Passcode";
        pass2El.classList.add("is-hidden");
        goEl.textContent = "Unlock";
        resetEl.classList.remove("is-hidden");
        resetEl.textContent = "Reset passcode";
      }
      try{ passEl.focus(); }catch(e){}

      formEl.onsubmit = function(ev){
        ev.preventDefault();
        var p = passEl.value || "";
        if(makeNew){
          if(p.length < 4){ shake("Use at least 4 characters."); return; }
          if(p !== (pass2El.value || "")){ shake("The two entries don't match."); return; }
          sha256(p).then(function(h){
            ref.set({ appPasscode: h }, { merge: true }).then(function(){
              lsSet("wedledger.passHash", h);
              if(trustEl.checked) lsSet("wedledger.cloudTrust", h); else lsDel("wedledger.cloudTrust");
              enterApp(user, ref, snap);
            }, function(){ shake("Couldn't save the passcode. Try again."); });
          });
        }else{
          sha256(p).then(function(h){
            if(h === existingHash){
              if(trustEl.checked) lsSet("wedledger.cloudTrust", h); else lsDel("wedledger.cloudTrust");
              enterApp(user, ref, snap);
            }else shake("Incorrect passcode.");
          });
        }
      };

      resetEl.onclick = function(){
        if(resetEl.getAttribute("data-armed") === "1"){
          ref.set({ appPasscode: "" }, { merge: true }).then(function(){
            lsDel("wedledger.cloudTrust"); lsDel("wedledger.passHash");
            resetEl.removeAttribute("data-armed");
            passcodeStep(user, ref, "", snap);
          }, function(){ shake("Couldn't reset. Try again."); });
        }else{
          resetEl.setAttribute("data-armed", "1");
          resetEl.textContent = "You're signed in — click again to reset";
          setTimeout(function(){
            resetEl.removeAttribute("data-armed");
            resetEl.textContent = "Reset passcode";
          }, 4000);
        }
      };
    }

    function afterSignIn(user){
      fbUser = user;
      formEl.classList.add("is-hidden");
      resetEl.classList.add("is-hidden");
      cloudBox.classList.remove("is-hidden");
      subEl.textContent = "";
      cloudBox.innerHTML = '<p class="lock-sub">Checking access…</p>';
      var ref = window.firebase.firestore().doc("wallets/" + user.uid);
      ref.get().then(function(snap){
        var hash = (snap.exists && snap.data() && snap.data().appPasscode) || "";
        passcodeStep(user, ref, hash, snap);
      }, function(e){
        if(e && e.code === "permission-denied"){ showDenied(user); return; }
        cloudBox.innerHTML = '<p class="lock-sub">Couldn\'t reach the server. Check your connection.</p>' +
          '<button type="button" class="btn gbtn" id="retryBtn">Retry</button>' +
          '<button type="button" class="lock-reset" data-signout style="display:block">Sign out</button>';
        document.getElementById("retryBtn").onclick = function(){ afterSignIn(user); };
        wireOut(cloudBox);
      });
    }

    subEl.textContent = "";
    cloudBox.innerHTML = '<p class="lock-sub">Loading…</p>';
    loadFirebase(function(err){
      if(err){ showGoogle("Couldn't load sync. Check your connection, then retry."); return; }
      try{
        if(!window.firebase.apps.length) window.firebase.initializeApp(window.FIREBASE_CONFIG);
      }catch(e){
        cloudBox.innerHTML = '<p class="lock-sub">The sync configuration looks invalid.</p>';
        return;
      }
      fbAuth = window.firebase.auth();
      fbAuth.onAuthStateChanged(function(user){
        if(user){ afterSignIn(user); }
        else{ fbUser = null; cloud = null; showGoogle(); }
      });
    });
  }

  /* ---------- passcode gate (Claude artifact / local-only) ---------- */
  var LS_HASH = "wedledger.passHash", LS_TRUST = "wedledger.trust";
  var knownHash = null, appStarted = false, creating = false;

  function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function lsSet(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
  function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

  function sha256(str){
    var data = new TextEncoder().encode("wedledger::" + str);
    if(window.crypto && crypto.subtle && crypto.subtle.digest){
      return crypto.subtle.digest("SHA-256", data).then(function(buf){
        var out = "", v = new Uint8Array(buf), i;
        for(i = 0; i < v.length; i++) out += ("0" + v[i].toString(16)).slice(-2);
        return out;
      });
    }
    var h = 5381; for(var i = 0; i < str.length; i++){ h = ((h << 5) + h) ^ str.charCodeAt(i); }
